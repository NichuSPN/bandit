name: Release Bandit Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: bandit-v${{ github.ref_name }}-linux-amd64.tar.gz
            binary_name: bandit
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: bandit-v${{ github.ref_name }}-darwin-arm64.tar.gz
            binary_name: bandit
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: bandit-v${{ github.ref_name }}-darwin-amd64.tar.gz
            binary_name: bandit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: bandit-v${{ github.ref_name }}-windows-amd64.zip
            binary_name: bandit.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup MSYS2 GCC (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build Rust Engine (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd bandit_engine
          cargo build --release --target ${{ matrix.target }}
          mkdir -p target/release
          cp -r target/${{ matrix.target }}/release/* target/release/ || true

      - name: Build Rust Engine (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          cd bandit_engine
          cargo build --release
          if (!(Test-Path "target\release")) { New-Item -ItemType Directory -Force -Path "target\release" }
          Copy-Item -Path "target\x86_64-pc-windows-msvc\release\*" -Destination "target\release" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build Go Binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          CGO_ENABLED=1 go build -o ${{ matrix.binary_name }} main.go
          tar -czvf ${{ matrix.artifact_name }} ${{ matrix.binary_name }} README.md LICENSE

      - name: Build Go Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $env:CGO_ENABLED="1"
          go build -o ${{ matrix.binary_name }} main.go
          Compress-Archive -Path ${{ matrix.binary_name }}, README.md, LICENSE -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
