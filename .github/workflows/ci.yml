name: CI & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MinGW GCC (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          if (Test-Path "C:\msys64\mingw64\bin") {
            "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            choco install mingw -y
          }

      - name: Build Rust Engine
        run: |
          cd bandit_engine
          cargo build --release

      - name: Rust Engine Tests
        run: |
          cd bandit_engine
          cargo test

      - name: Go Unit Tests
        run: |
          go test ./...
