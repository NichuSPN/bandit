name: CI & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup MSYS2 GCC (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Set up Rust (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust (Windows GNU)
        if: matrix.os == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build Rust Engine (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd bandit_engine
          cargo build --release

      - name: Build Rust Engine (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd bandit_engine
          cargo build --release --target x86_64-pc-windows-gnu
          mkdir -p target/release
          cp -r target/x86_64-pc-windows-gnu/release/* target/release/ || true

      - name: Rust Engine Tests (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd bandit_engine
          cargo test

      - name: Rust Engine Tests (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd bandit_engine
          cargo test --target x86_64-pc-windows-gnu

      - name: Go Unit Tests
        run: |
          go test ./...
